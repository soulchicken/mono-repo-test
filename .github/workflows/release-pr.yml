name: Release PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 제목과 릴리스 준비 상태를 검사할 main 대상 PR 번호
        required: true
        type: string

concurrency:
  group: release-pr-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Release PR Metadata
    if: github.repository == 'soulchicken/mono-repo-test'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Enforce release branches
        id: candidate
        uses: actions/github-script@v7
        with:
          script: |
            const number = Number(context.payload.pull_request?.number ?? context.payload.inputs?.pull_request_number)
            if (!Number.isSafeInteger(number) || number < 1) {
              throw new Error('Specify a valid pull request number.')
            }
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number })
            if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.head.ref !== 'develop' || pr.head.repo.full_name !== process.env.GITHUB_REPOSITORY) {
              throw new Error('Choose an open develop → main PR from this repository.')
            }
            core.setOutput('number', pr.number)
            core.setOutput('base_sha', pr.base.sha)
            core.setOutput('head_sha', pr.head.sha)

      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate release and update PR title
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.candidate.outputs.number }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
        with:
          script: |
            const { execFileSync } = require('node:child_process')
            const number = Number(process.env.PR_NUMBER)
            const metadata = JSON.parse(execFileSync('node', [
              'scripts/release-pr.mjs', process.env.BASE_SHA, process.env.HEAD_SHA,
            ], { encoding: 'utf8' }))
            const { data: current } = await github.rest.pulls.get({
              ...context.repo, pull_number: number,
            })
            if (current.head.sha !== process.env.HEAD_SHA || current.base.sha !== process.env.BASE_SHA) {
              throw new Error('The release branches changed. Re-run this workflow on the latest PR.')
            }
            if (current.title !== metadata.title) {
              await github.rest.pulls.update({
                ...context.repo, pull_number: number, title: metadata.title,
              })
            }
            await core.summary
              .addHeading(metadata.title)
              .addTable([
                [{ data: 'Package', header: true }, { data: 'Before', header: true }, { data: 'After', header: true }],
                ...metadata.releases.map(pkg => [pkg.name, pkg.oldVersion ?? 'new', pkg.version]),
              ])
              .write()
